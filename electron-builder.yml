appId: com.sallehli.aljoker
productName: الجوكر-صلحلي-الاصدار v1.2.0
compression: maximum
electronLanguages:
  - ar
  - en-US
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/**'
  - '!src/**'
  - '!docs/**'
  - '!scripts/**'
  - '!backups/**'
  - '!**/*.pem'
  - '!**/*.key'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,*.tsbuildinfo}'
  - '!out/*.tsbuildinfo'
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'
  - '!node_modules/better-sqlite3/prebuilds/darwin-*'
  - '!node_modules/better-sqlite3/prebuilds/linux*'
  - '!node_modules/better-sqlite3/prebuilds/win32-arm64*'
  - '!node_modules/node-addon-api/**'
asarUnpack:
  - '**/*.node'
  - 'resources/**'
win:
  executableName: Sallehli
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: الجوكر-صلحلي-الاصدار-v1.2.0-Setup-x64.${ext}
  shortcutName: الجوكر-صلحلي-الاصدار v1.2.0
  uninstallDisplayName: الجوكر-صلحلي-الاصدار v1.2.0
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/installerIcon.ico
  uninstallerIcon: build/uninstallerIcon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  include: build/installer.nsh
  installerLanguages:
    - ar_SA
    - en_US
  language: "1025"
  # التطبيق لا يستخدم التحديث التلقائي (electron-updater)، لذلك نعطّل الحزمة التفاضلية.
  # وضعها الافتراضي يفرض ضغطاً "normal" غير مُصمت بقاموس 1MB ويتجاهل compression: maximum.
  # بتعطيلها يُضغط المثبت فعلياً بأقصى ضغط LZMA2 مُصمت (Solid) => حجم أصغر بكثير بدون أي تأثير على التطبيق.
  differentialPackage: false
npmRebuild: false
